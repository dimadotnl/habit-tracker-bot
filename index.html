<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Трекер привычек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <div class="header">
    <h1>Трекер привычек</h1>
  </div>

  <!-- Плашка статуса пары -->
  <div id="pair-badge" class="pair-badge">
    <span>Загрузка статуса...</span>
  </div>

  <!-- Переключатель вкладок -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-my" onclick="switchTab('my')">Мои привычки</button>
    <button class="tab-btn couple-tab" id="tab-couple" onclick="switchTab('couple')">Общие привычки 💕</button>
  </div>

  <!-- Дни недели (5 дней) -->
  <div class="days-header" id="days-header"></div>

  <!-- Контейнер для карточек привычек -->
  <div class="habits-list" id="habits-list"></div>

  <!-- Кнопка с плюсом для добавления привычки -->
  <button class="fab" onclick="openAddModal()">+</button>

  <!-- Модальное окно создания привычки -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Новая привычка</h2>
      <input type="text" id="habit-name" class="form-input" placeholder="Название (напр., Спортзал, Чтение)" />
      <input type="text" id="habit-icon" class="form-input" placeholder="Иконка (напр., 💪, 📖, 💧)" value="⭐" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
        <button class="btn-submit" onclick="submitHabit()">Создать</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=42"></script>
</body>
</html>
