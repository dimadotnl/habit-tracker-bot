<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Трекер привычек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --text: #ffffff;
      --text-sec: #a0a0ab;
      --accent: #6c5ce7;
      --accent-couple: #ff7675;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 90px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }
    /* Виджет статуса пары */
    .pair-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .pair-badge.linked {
      background: rgba(255, 118, 117, 0.12);
      border-color: rgba(255, 118, 117, 0.35);
      color: #ffb8b8;
    }
    .pair-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-sec);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn.active.couple-tab {
      background: var(--accent-couple);
      border-color: var(--accent-couple);
    }
    .days-header {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 10px;
      padding-right: 8px;
    }
    .day-col {
      width: 32px;
      text-align: center;
      font-size: 11px;
      color: var(--text-sec);
    }
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .habit-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .habit-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }
    .habit-icon {
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
    }
    .habit-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .habit-checks {
      display: flex;
      gap: 6px;
    }
    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: transparent;
      font-size: 14px;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .check-btn:active {
      transform: scale(0.9);
    }
    .check-btn.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
      cursor: pointer;
    }
    /* Модальное окно добавления */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
    }
    .modal-content h2 {
      margin-bottom: 16px;
      font-size: 18px;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-submit {
      flex: 1;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      padding: 12px 18px;
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Трекер привычек</h1>
  </div>

  <!-- Статус пары (будет заполнен через script.js) -->
  <div id="pair-badge" class="pair-badge">
    <span>Загрузка статуса...</span>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-my" onclick="switchTab('my')">Мои привычки</button>
    <button class="tab-btn couple-tab" id="tab-couple" onclick="switchTab('couple')">Общие привычки 💕</button>
  </div>

  <!-- Дни недели (последние 5 дней) -->
  <div class="days-header" id="days-header"></div>

  <!-- Список привычек -->
  <div class="habits-list" id="habits-list"></div>

  <!-- Кнопка добавления -->
  <button class="fab" onclick="openAddModal()">+</button>

  <!-- Модальное окно -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Новая привычка</h2>
      <input type="text" id="habit-name" class="form-input" placeholder="Название (напр., Спортзал, Чтение)" />
      <input type="text" id="habit-icon" class="form-input" placeholder="Иконка (напр., 💪, 📖, 💧)" value="⭐" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
        <button class="btn-submit" onclick="submitHabit()">Создать</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=41"></script>
</body>
</html>
